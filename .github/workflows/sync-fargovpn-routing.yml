name: Sync FargoVPN routing profile

on:
  workflow_dispatch:
  schedule:
    - cron: '47 */6 * * *'
  push:
    branches: [main]
    paths:
      - .github/workflows/sync-fargovpn-routing.yml
      - routing/sync.mjs

permissions:
  contents: write

concurrency:
  group: sync-fargovpn-routing
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'Menshikovivan/FargoVPN' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: main
      - name: Generate and verify profiles
        run: node routing/sync.mjs
      - name: Publish routing files when changed
        run: |
          set -euo pipefail
          git add -- routing/public
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Refresh FargoVPN routing profiles'
          git push origin HEAD:main
