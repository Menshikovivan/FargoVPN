yamlname: Delete Old Releases

on:
  schedule:
    - cron: '0 0 * * 0' # Автозапуск каждое воскресенье в 00:00 UTC
  workflow_dispatch: # Позволяет запускать вручную кнопкой

jobs:
  delete-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Delete old releases
        uses: dev-drprasad/delete-older-releases@v0.3.4
        with:
          keep_latest: 5 # Сколько последних релизов оставить (остальные удалятся)
          delete_tags: true # Удалять ли теги, привязанные к старым релизам
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
